<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic and Assignment Operations</title>
</head>
<body>
    <script>
        // Arithmetic Operations
        let a = 10, b = 5;

        console.log("Arithmetic Operations:");

        // Addition
        let sum = a + b;
        console.log(`${a} + ${b} = ${sum}`);

        // Subtraction
        let difference = a - b;
        console.log(`${a} - ${b} = ${difference}`);

        // Multiplication
        let product = a * b;
        console.log(`${a} * ${b} = ${product}`);

        // Division
        let quotient = a / b;
        console.log(`${a} / ${b} = ${quotient}`);

        // Modulus (remainder)
        let remainder = a % b;
        console.log(`${a} % ${b} = ${remainder}`);


        // Assignment Operations
        console.log("\nAssignment Operations:");

        // Simple Assignment
        let x = 15;
        console.log("x = 15, x is now: " + x);

        // Addition Assignment
        x += 5; // Same as x = x + 5
        console.log("x += 5, x is now: " + x);

        // Subtraction Assignment
        x -= 3; // Same as x = x - 3
        console.log("x -= 3, x is now: " + x);

        // Multiplication Assignment
        x *= 2; // Same as x = x * 2
        console.log("x *= 2, x is now: " + x);

        // Division Assignment
        x /= 4; // Same as x = x / 4
        console.log("x /= 4, x is now: " + x);

    </script>
</body>
</html>
