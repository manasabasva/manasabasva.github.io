<!DOCTYPE html>
<html>
<head>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        input {
            padding: 10px;
            font-size: 16px;
            margin: 10px;
            width: 200px;
            text-align: center;
        }
        #grade {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>Grade Calculator</h2>
    <input type="number" id="score" placeholder="Enter your score" oninput="calculateGrade()">
    <div id="grade">Your Grade: </div>

    <script>
        function calculateGrade() {
            let score = document.getElementById("score").value;
            let grade = "";
            
            if (score >= 80) {
                grade = "A";
            } else if (score >= 60) {
                grade = "B";
            } else if (score >= 40) {
                grade = "C";
            } else if (score >= 0) {
                grade = "F";
            } else {
                grade = "Invalid Score";
            }

            document.getElementById("grade").textContent = "Your Grade: " + grade;
        }
    </script>

</body>
</html>
