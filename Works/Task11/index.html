<!DOCTYPE html>
<html>
<head>
    <title>Combined HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        .section {
            border: 2px solid #333;
            padding: 20px;
            margin: 20px auto;
            width: 50%;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

        .button {
            margin-top: 10px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background-color: #007bff;
            color: white;
        }

        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Section 1: Star Pattern Generation -->
    <div class="section">
        <h2>Star Pattern Generator</h2>
        <input id="user_input" placeholder="Enter size" onkeyup="generate_shape();">
        <div id="content_div" style="color: blue; margin-top: 10px;"></div>
    </div>

    <!-- Section 2: Sum Calculation -->
    <div class="section">
        <h2>Simple Sum Calculator</h2>
        <input id="input_a" placeholder="Enter A">
        <input id="input_b" placeholder="Enter B">
        <button class="button" onclick="calculate()">Calculate</button>
        <div id="result">SUM: 0</div>
    </div>

    <!-- Section 3: Odd Row Star Pattern -->
    <div class="section">
        <h2>Odd Row Star Pattern</h2>
        <input id="odd_user_input" placeholder="Enter size" onkeyup="generate_odd_shape();">
        <div id="odd_content_div" style="color: blue; margin-top: 10px;"></div>
    </div>

    <script>
        let colors = ["red", "blue", "green", "orange"];
        let idx = 0;
        let size = colors.length;

        function generate_shape() {
            let n = parseInt(document.getElementById("user_input").value);
            let text = "";

            for (let i = 0; i <= n; i++) {
                for (let j = 0; j <= i; j++) {
                    text += "* ";
                }
                text += "<br>";
            }

            document.getElementById("content_div").innerHTML = text;
            document.getElementById("content_div").style.color = colors[idx];
            idx = (idx + 1) % size;
        }

        function calculate() {
            let num1 = parseInt(document.getElementById("input_a").value);
            let num2 = parseInt(document.getElementById("input_b").value);
            let sum = 0;

            for (let counter = 0; counter < num1; counter++) {
                sum += 1;
            }

            for (let counter2 = 0; counter2 < num2; counter2++) {
                sum += 1;
            }

            document.getElementById("result").textContent = "SUM: " + sum;
        }

        function generate_odd_shape() {
            let n = parseInt(document.getElementById("odd_user_input").value);
            let text = "";

            let i = 1;
            while (i <= n) {
                let stars = "";
                let j = 0;
                while (j < i) {
                    stars += "* ";
                    j++;
                }
                text += stars + "<br>";
                i += 2;
            }

            document.getElementById("odd_content_div").innerHTML = text;
            document.getElementById("odd_content_div").style.color = colors[idx];
            idx = (idx + 1) % size;
        }
    </script>

</body>
</html>
