<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            color: white;
        }

        .container {
            width: 60%;
            margin: auto;
            background-color: black;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            border: 3px solid rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .header {
            background-color: #333;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3);
        }

        .subtext {
            font-size: 16px;
            font-style: italic;
            margin-top: 5px;
            color: #bbb;
        }

        .content-box {
            background-color: #444;
            padding: 50px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .button-container {
            margin-top: 20px;
        }

        .button {
            background-color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            text-decoration: none;
            color: black;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }

        .button:hover {
            background-color: lightgray;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            Welcome to the Custom Dashboard
            <div class="subtext">It doesn't have any functionalities yet!</div>
        </div>

        <div class="content-box"></div>

        <div class="button-container">
            <a href="../Task2/index.html" class="button">Return to Home</a>
        </div>
    </div>
    
</body>
</html>
