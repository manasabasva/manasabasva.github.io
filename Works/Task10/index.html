<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Call Stack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            color: #333;
        }
        #taskPipeline {
            width: 100%;
            height: 30px;
            margin-top: 10px;
        }
        button {
            margin-top: 10px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h2>Task Call Stack</h2>
    <div>
        <label for="taskName">Task Name:</label>
        <input type="text" id="taskName" placeholder="Enter task name">
        <button id="addTaskBtn">Add Task</button>
        <button id="undoTaskBtn">Undo Task</button>
    </div>

    <div>
        <h3>Process Line:</h3>
        <textarea id="taskPipeline" readonly=""></textarea>
    </div>

    <script>
        class TaskCallStack {
            constructor() {
                this.stack = []; 
            }

            addTask(taskName) {
                this.stack.push(taskName); 
            }

            
            undoTask() {
                if (this.stack.length > 0) {
                    this.stack.pop(); 
                }
            }

            getCurrentPipeline() {
                return this.stack.join(", "); 
            }
        }

        const taskStack = new TaskCallStack();

        
        const taskNameInput = document.getElementById("taskName");
        const addTaskBtn = document.getElementById("addTaskBtn");
        const undoTaskBtn = document.getElementById("undoTaskBtn");
        const taskPipeline = document.getElementById("taskPipeline");

        addTaskBtn.addEventListener("click", () => {
            const taskName = taskNameInput.value.trim();
            if (taskName !== "") {
                taskStack.addTask(taskName); 
                taskNameInput.value = ""; 
                updatePipelineDisplay(); 
            } else {
                alert("Please enter a task name.");
            }
        });

        undoTaskBtn.addEventListener("click", () => {
            taskStack.undoTask(); 
            updatePipelineDisplay(); 
        });

        function updatePipelineDisplay() {
            taskPipeline.value = taskStack.getCurrentPipeline(); 
        }
    </script>



</body></html>
