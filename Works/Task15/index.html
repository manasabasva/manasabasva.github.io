<!DOCTYPE html>
<html>
<head>
    <title>Age Calculator & Checkout</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 500px;
            margin-top: 30px;
        }
        .section-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        .btn-cancel {
            background-color: #fbc02d;
            color: black;
            font-weight: bold;
        }
        .btn-checkout {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">MyStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-primary" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Age Calculator Section -->
        <div class="section-box text-center">
            <h4>Age Calculator</h4>
            <input type="date" id="dob" class="form-control mt-2">
            <button class="btn btn-primary mt-3" type="button" onclick="calculate()">Calculate Age</button>
            <p id="result" class="mt-3">Your age is: 0 years.</p>
        </div>

        <!-- Checkout Form Section -->
        <div class="section-box">
            <h4 class="text-center mb-3">Checkout</h4>
            
            <form>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" placeholder="Enter your username">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name">
                </div>
                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-cancel w-50 me-2">Cancel</button>
                    <button type="button" class="btn btn-checkout w-50">Continue to Checkout</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        class AgeCal {
            constructor(dob) {
                this.dob = new Date(dob);
                this.today = new Date();
            }

            getAge() {
                let age = this.today.getFullYear() - this.dob.getFullYear();
                let monthDiff = this.today.getMonth() - this.dob.getMonth();
                let dayDiff = this.today.getDate() - this.dob.getDate();

                if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
                    age--;
                }
                return age;
            }
        }

        function calculate() {
            let dobInput = document.getElementById("dob").value;
            if (!dobInput) {
                document.getElementById("result").innerText = "Please enter your date of birth.";
                return;
            }

            let ageCalc = new AgeCal(dobInput);
            document.getElementById("result").innerText = "Your age is: " + ageCalc.getAge() + " years.";
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
