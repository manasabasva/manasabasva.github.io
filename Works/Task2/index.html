<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: #d3d3d3;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            width: 60%;
            margin: 30px auto;
        }

        .content-box {
            background-color: lightblue;
            padding: 20px;
            border-radius: 10px;
            width: 60%;
            margin: 20px auto;
            text-align: left;
            font-size: 16px;
        }

        .button-container {
            margin-top: 20px;
        }

        .button {
            background-color: white;
            border: 1px solid black;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
        }

        .button:hover {
            background-color: lightgray;
        }
    </style>
</head>
<body>

    <div class="header">Welcome to My Custom Designed Page!</div>
    
    <div class="content-box">
        <p>This is some random text! Lorem ipsum dolor sit amet consectetur adipiscing elit. 
        Fugiat mollitia enim sunt sapiente nemo assumenda eius tenetur architecto repellat, minus aut! 
        Unde, ut hic. Pariatur repellat fugit esse explicabo officia!</p>
    </div>

    <div class="button-container">
        <a href="../Task2b/index.html" class="button">Go to Dashboard</a>
    </div>
    
</body>
</html>
