<!DOCTYPE html>
<html>
<head>
   
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        input, output {
            padding: 10px;
            font-size: 16px;
            margin: 10px;
            width: 300px;
        }
        output {
            border: 1px solid #000;
            min-height: 30px;
            display: block;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <input type="text" id="inputField" placeholder="Type something...">
    <output id="outputField"></output>

    <script>
        document.getElementById("inputField").addEventListener("input", function() {
            document.getElementById("outputField").textContent = this.value.toUpperCase();
        });
    </script>

</body>
</html>
