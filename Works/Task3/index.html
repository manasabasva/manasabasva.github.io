<!DOCTYPE html>
<html>
<head>
   
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fff;
        }
        .logo {
            font-size: 50px;
            font-family: Arial, sans-serif;
            display: flex;
            gap: 5px;
        }
        .letter {
            transition: transform 0.3s ease-in-out;
        }
        .letter:hover {
            transform: scale(1.2);
        }
        .blue { color: #4285F4; }
        .red { color: #DB4437; }
        .yellow { color: #F4B400; }
        .green { color: #0F9D58; }
    </style>
</head>
<body>
    <div class="logo">
        <span class="letter blue">G</span>
        <span class="letter red">o</span>
        <span class="letter yellow">o</span>
        <span class="letter blue">g</span>
        <span class="letter green">l</span>
        <span class="letter red">e</span>
    </div>
</body>
</html>
