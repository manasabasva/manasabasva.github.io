<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Task Viewer</title> 
<!-- Google Font for a modern look --> 
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"> 
<!-- CSS for Styling --> 
<style> 
* { 
margin: 0; 
padding: 0; 
box-sizing: border-box; 
} 
body { 
font-family: 'Poppins', sans-serif; 
display: flex; 
height: 100vh; 
background-color: #f7f7f7; 
} 
/* Main container for layout */ 
.container { 
display: flex; 
width: 100%; 
height: 100%; 
} 
/* Left side task list */ 
.task-list { 
width: 250px; 
background-color: #333; 
color: white; 
padding: 20px; 
border-right: 2px solid #444; 
overflow-y: auto; 
display: flex; 
flex-direction: column; 
} 
.task-list h2 { 
margin-bottom: 30px; 
font-weight: 600; 
color: #fff; 
} 
.task-list ul { 
list-style-type: none; 
padding: 0; 
} 
.task-list li { 
padding: 12px 20px; 
margin-bottom: 15px; 
border-radius: 5px; 
cursor: pointer; 
transition: background-color 0.3s ease; 
} 
.task-list li:hover { 
background-color: #007bff; 
color: white; 
} 
.task-list li:active { 
background-color: #0056b3; 
} 
/* Right side content */ 
.task-content { 
flex-grow: 1; 
padding: 20px; 
background-color: #fff; 
overflow-y: auto; 
transition: all 0.3s ease; 
} 
.task-content h1 { 
color: #333; 
font-weight: 600; 
} 
iframe { 
width: 100%; 
height: 100%; 
border: none; 
border-radius: 5px; 
} 
/* Responsive Design */ 
@media (max-width: 768px) { 
.container { 
flex-direction: column; 
} 
.task-list { 
width: 100%; 
border-right: none; 
border-bottom: 2px solid #444; 
display: flex; 
flex-wrap: wrap; 
} 
.task-list ul { 
display: flex; 
flex-wrap: wrap; 
justify-content: space-between; 
width: 100%; 
} 
.task-list li { 
width: 45%; 
margin-bottom: 10px; 
font-size: 14px; 
} 
} 
</style> 
</head> 
<body> 
<!-- Main Layout --> 
<div class="container"> 
<!-- Left side Task List --> 
<div class="task-list"> 
<h2>Tasks</h2> 
<ul id="task-list"> 
<!-- Task items will be inserted here dynamically --> 
<li onclick="loadTask('Works/Task1/index.html')">Task 1</li> 
<li onclick="loadTask('Works/Task2/index.html')">Task 2</li> 
<li onclick="loadTask('Works/Task3/index.html')">Task 3</li> 
<li onclick="loadTask('Works/Task4/index.html')">Task 4</li> 
<li onclick="loadTask('Works/Task5/index.html')">Task 5</li> 
<li onclick="loadTask('Works/Task6/index.html')">Task 6</li> 
<li onclick="loadTask('Works/Task7/index.html')">Task 7 Console View</li> 
<li onclick="loadTask('Works/Task8/index.html')">Task 8</li> 
<li onclick="loadTask('Works/Task9/index.html')">Task 9</li> 
<li onclick="loadTask('Works/Task10/index.html')">Task 10</li> 
<li onclick="loadTask('Works/Task11/index.html')">Task 11</li> 
<li onclick="loadTask('Works/Task12/index.html')">Task 12</li> 
<li onclick="loadTask('Works/Task13/index.html')">Task 13</li> 
<li onclick="loadTask('Works/Task14/index.html')">Task 14</li> 
<li onclick="loadTask('Works/Task15/index.html')">Task 15</li> 
<li onclick="loadTask('Works/Task16/index.html')">Task 16</li> 
</ul> 
</div> 
<!-- Right side content --> 
<div class="task-content" id="task-content"> 
<h1>Select a task from the left</h1> 
</div> 
</div> 
<!-- JavaScript for Dynamic Content Loading --> 
<script> 
function loadTask(taskPath) { 
const taskContent = document.getElementById('task-content'); 
// Create an iframe to display the task content 
const iframe = document.createElement('iframe'); 
iframe.src = taskPath; 
// Clear previous content and append the iframe 
taskContent.innerHTML = ''; 
taskContent.appendChild(iframe); 
} 
</script> 
</body> 
</html>
